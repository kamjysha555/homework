<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>форма-анкета</title>
		<link rel="stylesheet" href="./scc/normalize.css" />
		<link rel="stylesheet" href="./scc/style.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="form-group">
				<legend class="form-group-title">Ваши личные данные</legend>
				<label for="name" class="label">Ваше имя</label>
				<input
					id="name"
					class="input"
					type="text"
					placeholder="Имя"
					name="name"
					required
				/>
				<label for="age" class="label">Ваш возраст</label>
				<input
					id="age"
					class="input"
					type="number"
					inputmode="numeric"
					placeholder="Возраст"
					name="age"
					required
				/>
				<label for="tel" class="label">Ваш номер телефона</label>
				<input
					disabled
					id="tel"
					class="input"
					type="tel"
					inputmode="tel"
					placeholder="Номер телефона"
					name="phone"
					required
				/>
				<label for="email" class="label">Ваша почта</label>
				<input
					id="email"
					class="input"
					type="email"
					inputmode="email"
					placeholder="Почта"
					name="email"
					required
				/>
			</fieldset>
			<fieldset class="form-group">
				<label for="message" class="label">Сообщение</label>
				<textarea
					id="message"
					class="textarea"
					placeholder="Сообщение"
					name="message"
					required
				></textarea>

				<label class="label checkbox-leble">
					<input class="checkbox" name="checkbox" type="checkbox" required />
					<span class="checkbox-text">Я принимаю правила</span>
				</label>
			</fieldset>
			<button class="button" type="submit">отправить</button>
		</form>
	</body>
</html>
